packages:
  - apps/*
  - packages/*

# Every shared pin lives here. Packages reference these with the `catalog:` protocol
# so a version is stated exactly once for the whole workspace.
catalog:
  '@eslint/js': ^9.39.5
  '@types/node': ^24.13.6
  eslint: ^9.39.5
  eslint-config-prettier: ^10.1.8
  globals: ^17.12.0
  prettier: ^3.9.8
  turbo: ^2.11.2
  # TypeScript is held at 6.0.x on purpose. 7.x is the native port and neither
  # Expo SDK 57 nor typescript-eslint 8 supports it yet.
  typescript: ~6.0.3
  typescript-eslint: ^8.70.0
  # Vitest is held at 4.1.11 EXACTLY, which is what docs/increments/04-api-bootstrap.facts.md
  # pins. @cloudflare/vitest-plugin 1.1.x peers on ^4.1 and Vitest 5 breaks the Workers pool, so a
  # caret is out of the question; a tilde would still float to any 4.1.x, and nothing in the
  # repository enforces the facts sheet's value once it floats (the toolchain guard's pair
  # assertion deliberately covers wrangler, not vitest). Exact here, moved deliberately.
  vitest: 4.1.11
  zod: ^4.6.5
  # tsx runs packages/shared/scripts/gen-cadence-table.ts and packages/db's drizzle-kit and
  # migrate entry points.
  tsx: ^4.23.13
  # Postgres stack (increment 3). drizzle-orm and drizzle-kit are exact pins: the API surface used
  # is restricted to what 1.0 rc keeps, but the migration folder format and the generated SQL are
  # version-specific and must not move under a caret. postgres.js is the single driver on every
  # path (Workers via Hyperdrive, CI, scripts, tests).
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  postgres: ^3.4.9
  # Real PostgreSQL 18.4 binaries inside the npm tarball, no Docker or Homebrew. Exact prerelease
  # pin; the package has open hang reports so the test harness wraps every call in a timeout.
  embedded-postgres: 18.4.0-beta.17
  # geo-tz is used only by scripts/fetch-seed-data.mjs to propose a timezone for airports that
  # mwgg/Airports does not cover. Its boundary data is ODbL, so it never runs at build or runtime
  # and the reviewed output is committed as curated data.
  geo-tz: ^8.1.9

  # Cloudflare toolchain (increment 4). wrangler and @cloudflare/vitest-plugin are exact pins that
  # must move together: the plugin declares `wrangler` as a normal dependency at an exact version
  # (1.1.13 declares 4.135.0) and a second wrangler copy means a second workerd build in one
  # install. scripts/toolchain-guard.mjs asserts the pair rather than a frozen constant.
  wrangler: 4.135.0
  '@cloudflare/vitest-plugin': 1.1.13
  # @vitest/runner and @vitest/snapshot are peers of @cloudflare/vitest-plugin. pnpm's isolated
  # linker does not hoist them into apps/api, so they are declared explicitly and pinned to the
  # same exact version as vitest itself.
  '@vitest/runner': 4.1.11
  '@vitest/snapshot': 4.1.11
  hono: ^4.13.8
  '@hono/zod-validator': ^0.9.1
  # @sentry/cloudflare and @sentry/hono share an internal core and must be the same version.
  # Exact pins on both, moved together.
  '@sentry/cloudflare': 10.75.0
  '@sentry/hono': 10.75.0

  # Auth (increment 5). better-auth and @better-auth/expo are exact pins that move together: the
  # Expo package is npm-pinned to the same better-auth line and the server-side plugin registers
  # routes whose shapes the mobile client (increment 9) depends on. jose verifies Apple and Google
  # identity tokens and mints the Apple client secret; it is MIT, dependency free and documents
  # Workers support. Nothing else was added on the API for this increment.
  better-auth: 1.7.5
  '@better-auth/expo': 1.7.5
  jose: ^6.2.12

  # Not installed yet. Versions verified 2026-09-19 and recorded here so the
  # increment that adds them does not have to rediscover the pin.
  #
  # expo: ~57.0.24                         increment 9

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - '@types/node@24.13.6'
  - turbo@2.11.2

# pnpm 12 asks for an explicit allow list before running a dependency's install script.
# esbuild's postinstall only verifies the platform binary that tsx (and later wrangler) need.
allowBuilds:
  esbuild: true
  # embedded-postgres platform packages recreate the symlinks inside the PostgreSQL binary tree
  # in their postinstall; without it initdb cannot find its shared libraries.
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/linux-x64': true
  # workerd's postinstall checks that the platform binary for this OS and architecture unpacked
  # correctly. Without it wrangler and the Vitest Workers pool cannot start a runtime.
  workerd: true
