packages:
  - apps/*
  - packages/*

# Every shared pin lives here. Packages reference these with the `catalog:` protocol
# so a version is stated exactly once for the whole workspace.
catalog:
  '@eslint/js': ^9.39.5
  '@types/node': ^24.13.6
  eslint: ^9.39.5
  eslint-config-prettier: ^10.1.8
  # apps/mobile only (increment 9): the rules of hooks and exhaustive deps. Its React Compiler
  # rules are not enabled (experiments.reactCompiler is off).
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.12.0
  prettier: ^3.9.8
  turbo: ^2.11.2
  # TypeScript is held at 6.0.x on purpose. 7.x is the native port and neither
  # Expo SDK 57 nor typescript-eslint 8 supports it yet.
  typescript: ~6.0.3
  typescript-eslint: ^8.70.0
  # Vitest is held at 4.1.11 EXACTLY, which is what docs/increments/04-api-bootstrap.facts.md
  # pins. @cloudflare/vitest-plugin 1.1.x peers on ^4.1 and Vitest 5 breaks the Workers pool, so a
  # caret is out of the question; a tilde would still float to any 4.1.x, and nothing in the
  # repository enforces the facts sheet's value once it floats (the toolchain guard's pair
  # assertion deliberately covers wrangler, not vitest). Exact here, moved deliberately.
  vitest: 4.1.11
  zod: ^4.6.5
  # tsx runs packages/shared/scripts/gen-cadence-table.ts and packages/db's drizzle-kit and
  # migrate entry points.
  tsx: ^4.23.13
  # Postgres stack (increment 3). drizzle-orm and drizzle-kit are exact pins: the API surface used
  # is restricted to what 1.0 rc keeps, but the migration folder format and the generated SQL are
  # version-specific and must not move under a caret. postgres.js is the single driver on every
  # path (Workers via Hyperdrive, CI, scripts, tests).
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  postgres: ^3.4.9
  # Real PostgreSQL 18.4 binaries inside the npm tarball, no Docker or Homebrew. Exact prerelease
  # pin; the package has open hang reports so the test harness wraps every call in a timeout.
  embedded-postgres: 18.4.0-beta.17
  # embedded-postgres's own dependency, declared by packages/db too so the test harness can
  # unhook the `beforeExit` handler it registers at import (packages/db/test/embedded.ts). The
  # range matches what embedded-postgres declares so pnpm resolves one instance.
  async-exit-hook: ^2.0.1
  # geo-tz is used only by scripts/fetch-seed-data.mjs to propose a timezone for airports that
  # mwgg/Airports does not cover. Its boundary data is ODbL, so it never runs at build or runtime
  # and the reviewed output is committed as curated data.
  geo-tz: ^8.1.9

  # Cloudflare toolchain (increment 4). wrangler and @cloudflare/vitest-plugin are exact pins that
  # must move together: the plugin declares `wrangler` as a normal dependency at an exact version
  # (1.1.13 declares 4.135.0) and a second wrangler copy means a second workerd build in one
  # install. scripts/toolchain-guard.mjs asserts the pair rather than a frozen constant.
  wrangler: 4.135.0
  '@cloudflare/vitest-plugin': 1.1.13
  # @vitest/runner and @vitest/snapshot are peers of @cloudflare/vitest-plugin. pnpm's isolated
  # linker does not hoist them into apps/api, so they are declared explicitly and pinned to the
  # same exact version as vitest itself.
  '@vitest/runner': 4.1.11
  '@vitest/snapshot': 4.1.11
  hono: ^4.13.8
  '@hono/zod-validator': ^0.9.1
  # @sentry/cloudflare and @sentry/hono share an internal core and must be the same version.
  # Exact pins on both, moved together.
  '@sentry/cloudflare': 10.75.0
  '@sentry/hono': 10.75.0

  # Auth (increment 5). better-auth and @better-auth/expo are exact pins that move together: the
  # Expo package is npm-pinned to the same better-auth line and the server-side plugin registers
  # routes whose shapes the mobile client (increment 9) depends on. jose verifies Apple and Google
  # identity tokens and mints the Apple client secret; it is MIT, dependency free and documents
  # Workers support. Nothing else was added on the API for this increment.
  better-auth: 1.7.5
  '@better-auth/expo': 1.7.5
  jose: ^6.2.12

  # Mobile (increment 9). Versions from docs/increments/09-11-mobile.facts.md "Pins" and Expo's
  # own SDK 57 manifest (bundledNativeModules.json); scripts/toolchain-guard.mjs asserts the ones
  # a drift would break. Tildes follow Expo's `expo install` convention for SDK packages; the
  # React Native triple and the libraries outside Expo's manifest are exact.
  expo: ~57.0.24
  react-native: 0.86.3
  react: 19.2.3
  # Nothing renders on the web; react-dom is here because expo-router's dependency tree (vaul,
  # the radix slot, @expo/metro-runtime) peers on it, and an unpinned auto-installed peer
  # resolved to 19.3.0, whose own peer asks for React 19.3.
  react-dom: 19.2.3
  # Same story: react-native-drawer-layout (an expo-router dependency) peers on reanimated and
  # gesture-handler, @expo/ui on worklets, and the auto-installed latest (4.7.0, 3.3.0, 0.13.0)
  # is outside SDK 57's manifest; all three carry native code the autolinker compiles. Pinned to
  # Expo's versions.
  react-native-reanimated: 4.5.1
  react-native-worklets: 0.10.1
  react-native-gesture-handler: ~2.32.0
  # Peer of @react-native/community-cli-plugin 0.86.3 at the exact React Native version; the
  # auto-installed latest was 0.87.1.
  '@react-native/metro-config': 0.86.3
  expo-router: ~57.0.22
  # Non-optional peers of expo-router 57.0.22 the template does not install. Under the isolated
  # linker every peer has to be a direct dependency of apps/mobile.
  '@expo/metro-runtime': ~57.0.16
  '@expo/log-box': ~57.0.4
  react-native-safe-area-context: ~5.7.0
  react-native-screens: ~4.26.0
  expo-build-properties: ~57.0.21
  expo-sqlite: ~57.0.3
  expo-secure-store: ~57.0.4
  expo-linking: ~57.0.10
  expo-network: ~57.0.2
  expo-constants: ~57.0.19
  expo-web-browser: ~57.0.3
  expo-apple-authentication: ~57.0.2
  expo-crypto: ~57.0.3
  expo-standard-web-crypto: ~57.0.3
  expo-notifications: ~57.0.20
  # Applies `userInterfaceStyle: automatic` on Android (the root view background in dark mode).
  expo-system-ui: ~57.0.4
  # `isDevice`: the Apple credential-state call is skipped on the Simulator, where it always
  # throws; also the model name POST /v1/devices records.
  expo-device: ~57.0.2
  # Development builds only (no Expo Go), and EAS Update with the fingerprint runtime version.
  expo-dev-client: ~57.0.19
  expo-updates: ~57.0.23
  # The native Google sign-in module increment 5 committed to; exact because it shipped 25
  # releases and two breaking majors in four months. nitro-modules is its required peer.
  react-native-nitro-google-signin: 2.3.0
  react-native-nitro-modules: 0.37.1
  # Expo SDK 57's own pin, not npm latest 8.x (facts section 4, decision 1).
  '@sentry/react-native': ~7.11.0
  # Exactly the version @sentry/react-native 7.11.0 depends on. Its Xcode "Upload Debug Symbols"
  # phase runs `require.resolve('@sentry/cli/package.json')` from apps/mobile under `set -e`, which
  # the isolated linker cannot answer unless apps/mobile declares the package itself (spike 1).
  '@sentry/cli': 2.58.4
  '@tanstack/react-query': ~5.103.1
  zustand: ~5.0.15
  # Dependency only in Phase 0 (New Architecture only, outside Expo's manifest).
  '@maplibre/maplibre-react-native': 11.4.0
  # Native surfaces (increment 11, ADR 0008). expo-widgets is EXACT (the facts sheet's pin inside
  # the manifest's ~57.0.20): its config plugin writes the widget extension, the Podfile target
  # and the literal `aps-environment` that plugins/withApsEnvironment.ts overrides, so a patch
  # release can change the generated project. @expo/ui is its dependency, declared because the
  # widget components in apps/mobile/widgets import their SwiftUI primitives from it.
  expo-widgets: 57.0.20
  '@expo/ui': ~57.0.19
  # The watchOS shells (apps/mobile/targets), exact: the coexistence spike proved THIS version
  # next to expo-widgets in one prebuild on Xcode 27 (ADR 0008). It depends on
  # @expo/prebuild-config ~55 (a second, SDK 55 copy of @expo/config-plugins in the tree) and on
  # the alpha @bacons/xcode pbxproj parser, so a bump is a new spike, never a Renovate merge.
  '@bacons/apple-targets': 5.0.0
  '@types/react': ~19.2.2
  babel-preset-expo: ~57.0.12
  # Inlines the drizzle-kit `.sql` migration files into migrations.js at Babel time, so Metro
  # never resolves a `.sql` import and metro.config.js stays exactly getSentryExpoConfig().
  babel-plugin-inline-import: ^3.0.0
  # jest-expo 57.0.5 is Jest 29 throughout; Jest 30 is unverified with it, so jest is exact.
  jest: 29.7.0
  jest-expo: ~57.0.5
  '@react-native/jest-preset': 0.86.3
  '@types/jest': ~29.5.14
  '@testing-library/react-native': ~14.0.1
  # 1.2.x, not the facts sheet's ~1.3.0: test-renderer 1.3.0 depends on react-reconciler ~0.34.0,
  # which peers on React ^19.3.0; 1.2.0's react-reconciler ~0.33.0 is the React 19.2 line.
  test-renderer: ~1.2.0

# pnpm's default hidden hoisting ('*' into node_modules/.pnpm/node_modules), minus one package.
# jest-expo brings jest-environment-jsdom and with it jsdom and @types/jsdom, and pnpm then links
# jsdom as vitest's optional peer in EVERY project. TypeScript reaches @types/jsdom from vitest's
# declarations through the hidden hoist directory, and its `/// <reference lib="dom" />` put the
# DOM lib into apps/api's program, where lib.dom's BufferSource broke src/crypto/envelope.ts.
# Keeping @types/jsdom out of the hidden hoist leaves vitest's jsdom import untyped (skipLibCheck)
# and the Worker's type graph as it was before apps/mobile existed.
hoistPattern:
  - '*'
  - '!@types/jsdom'

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - '@types/node@24.13.6'
  - turbo@2.11.2

# pnpm 12 asks for an explicit allow list before running a dependency's install script.
# esbuild's postinstall only verifies the platform binary that tsx (and later wrangler) need.
allowBuilds:
  esbuild: true
  # embedded-postgres platform packages recreate the symlinks inside the PostgreSQL binary tree
  # in their postinstall; without it initdb cannot find its shared libraries.
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/linux-x64': true
  # workerd's postinstall checks that the platform binary for this OS and architecture unpacked
  # correctly. Without it wrangler and the Vitest Workers pool cannot start a runtime.
  workerd: true
  # @sentry/cli's postinstall checks that the platform binary (@sentry/cli-darwin, -linux-x64)
  # unpacked; the Sentry Xcode and Gradle build phases and the source-map upload step run it.
  '@sentry/cli': true
