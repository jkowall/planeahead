name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      - run: pnpm prettier --check .

  # The Workers suite. From increment 5 it needs Postgres: apps/api/test/globalSetup.ts migrates
  # a database on this container and hands its URL to the Vitest Workers pool as the Hyperdrive
  # binding's local connection string (locally the same setup starts embedded-postgres). The
  # Durable Objects still never touch Postgres (ADR 0007); the auth, device and account tests do.
  test-workers:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: planeahead
          POSTGRES_PASSWORD: planeahead
          POSTGRES_DB: planeahead_admin
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://planeahead:planeahead@localhost:5432/planeahead_admin
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The api `test` script regenerates src/generated/migration-hash.ts before vitest runs, so
      # this job would stay green against a stale committed constant: it tests the value it just
      # wrote. Checking first is what makes the job that CONSUMES the constant also report on it,
      # rather than leaving that to wrangler-dry-run alone.
      - run: node scripts/gen-migration-hash.mjs --check
      # The harness prints which database it used. turbo's strict env mode once dropped
      # TEST_DATABASE_URL (turbo.json now lists it on the `test` task) and the suite quietly ran
      # on embedded-postgres while the container above sat idle; the grep makes that a failure.
      # `shell: bash` gives `-o pipefail`, which carries vitest's exit code through the tee. That
      # exit code is real only because packages/db/test/embedded.ts removes the `beforeExit`
      # handler embedded-postgres registers at import (it exited 0 over a failed run, in this job
      # too, service container or not); the vitest-exit-guard job below proves it every run.
      - name: Test the Worker against the service container
        shell: bash
        run: |
          pnpm turbo run test --filter=@planeahead/api 2>&1 | tee test-workers.log
          grep -q 'database source: shell' test-workers.log || {
            echo '::error title=Wrong database::the Workers suite did not use the postgres:18 service container (TEST_DATABASE_URL did not reach vitest)'
            exit 1
          }

  # Validates wrangler.jsonc and bundles the Worker without credentials: `wrangler deploy
  # --dry-run` never resolves an account id in 4.135.0. It does NOT verify that the KV, R2, queue
  # or Hyperdrive ids exist; the first staging deploy is that check.
  wrangler-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/gen-migration-hash.mjs --check
      - run: pnpm --filter @planeahead/api exec wrangler deploy --dry-run --env staging
      - run: pnpm --filter @planeahead/api exec wrangler deploy --dry-run --env production

  test:
    runs-on: ubuntu-latest
    # @planeahead/db runs its suite against this container through TEST_DATABASE_URL; the shared
    # package ignores the variable. Locally the same suite starts embedded-postgres.
    # src/migrate.ts asserts server_version_num >= 180000, which is the guard against this tag
    # ever resolving to a different major.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: planeahead
          POSTGRES_PASSWORD: planeahead
          POSTGRES_DB: planeahead_admin
          # initdb takes the cluster's default TimeZone from TZ. The harness asserts a zero
          # offset before any test runs (test/globalSetup.ts), so this is explicit, not lucky.
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://planeahead:planeahead@localhost:5432/planeahead_admin
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test --filter=!@planeahead/api

  # Proves that a failing test fails the run. embedded-postgres registers async-exit-hook at
  # import, which hooks `beforeExit` with exit code 0 and once overrode Vitest's exit code in both
  # packages that start the harness: their suites reported failures and exited 0, and the two test
  # jobs above stayed green. packages/db/test/embedded.ts removes the handler; this job runs a
  # deliberately failing fixture in apps/api and packages/db (scripts/vitest-exit-guard.mjs, on
  # the embedded cluster, where the hook had a server to guard) and asserts a non-zero exit. It
  # runs after the test jobs because a green test job means nothing until this one is green too.
  vitest-exit-guard:
    runs-on: ubuntu-latest
    needs: [test-workers, test]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The apps/api run bundles the Worker, which imports the generated migration hash.
      - run: node scripts/gen-migration-hash.mjs
      - run: node scripts/vitest-exit-guard.mjs

  toolchain-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/toolchain-guard.mjs
